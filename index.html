<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanimkulov.pro — Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --container-bg: #1c1c1e;
            --text-color: #ffffff;
            --text-secondary: #aeaeb2;
            --accent-color: #ff9f0a;
            --card-bg: #2c2c2e;
            --border-color: rgba(255, 255, 255, 0.08);
            --btn-tel: #3a3a3c;
        }

        /* 2-Musiqa temasi (Oq, ko'k, kulrang) */
        body.theme-2 {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-color: #1c1c1e;
            --text-secondary: #636366;
            --accent-color: #007aff;
            --card-bg: #f2f2f7;
            --border-color: rgba(0, 0, 0, 0.08);
            --btn-tel: #e5e5ea;
        }

        /* 3-Musiqa temasi (Qora, qizil, to'q ko'k) */
        body.theme-3 {
            --bg-color: #08080a;
            --container-bg: #141418;
            --text-color: #ffffff;
            --text-secondary: #98989f;
            --accent-color: #ff3b30;
            --card-bg: #1f1f24;
            --border-color: rgba(255, 59, 48, 0.2);
            --btn-tel: #26262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 25px 18px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pleyer va Musiqa Boshqaruvi */
        .music-player-box {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
        }

        .track-info i {
            color: var(--accent-color);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: transform 0.2s;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .play-pause-btn {
            background: var(--accent-color);
            color: #ffffff;
            width: 36px;
            height: 36px;
        }

        body.theme-2 .play-pause-btn {
            color: #ffffff;
        }

        /* Ovoz balandligi slayderi */
        .volume-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
        }

        .volume-box i {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--border-color);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }

        /* Profil Qismi */
        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar-box {
            width: 100px;
            height: 100px;
            margin: 0 auto 12px;
            border-radius: 50%;
            padding: 2px;
            background: var(--accent-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .username {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .fullname {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Statistika Bloki */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px 6px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-num {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 2px;
        }

        .stat-text {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Portfolio Videolar */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .horizontal-scroll-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 12px;
            margin-bottom: 22px;
            -webkit-overflow-scrolling: touch;
        }

        .horizontal-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .video-card {
            flex: 0 0 190px;
            scroll-snap-align: start;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .video-frame {
            width: 100%;
            height: 330px; 
            border-radius: 16px;
            background: #000000;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .video-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .rating-stars {
            display: flex;
            gap: 4px;
            cursor: pointer;
        }

        .rating-stars i {
            font-size: 13px;
            color: var(--border-color);
            transition: color 0.2s, transform 0.2s;
        }

        .rating-stars i.active {
            color: var(--accent-color);
            transform: scale(1.1);
        }

        /* Bog'lanish Tugmalari */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .contact-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 20px;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .contact-btn:active {
            transform: scale(0.95);
        }

        .contact-btn.tg {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
        }

        body.theme-2 .contact-btn.tg {
            color: #ffffff;
        }

        .contact-btn.tel {
            background: var(--btn-tel);
        }
    </style>
</head>

    <script>
        // Musiqa va Temalar ro'yxati
        const playlist = [
            { src: "musiqa1.mp3", name: "Musiqa 1 (Apple Vibe)", theme: "theme-1" },
            { src: "musiqa2.mp3", name: "Musiqa 2 (Clean Modern)", theme: "theme-2" },
            { src: "musiqa3.mp3", name: "Musiqa 3 (Dark & Red Drive)", theme: "theme-3" }
        ];

        let currentIndex = 0;
        const audio = document.getElementById('audio-element');
        const trackNameEl = document.getElementById('track-name');
        const playPauseIcon = document.getElementById('play-pause-icon');

        audio.volume = 0.5; // Boshlang'ich ovoz darajasi 50%

        function loadTrack(index) {
            audio.src = playlist[index].src;
            trackNameEl.innerText = playlist[index].name;
            
            // Temalarni o'zgartirish
            document.body.className = playlist[index].theme;
            audio.load();
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playPauseIcon.className = "fa-solid fa-pause";
            } else {
                audio.pause();
                playPauseIcon.className = "fa-solid fa-play";
            }
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            audio.play();
            playPauseIcon.className = "fa-solid fa-pause";
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            audio.play();
            playPauseIcon.className = "fa-solid fa-pause";
        }

        function changeVolume(val) {
            audio.volume = val;
        }

        // Yulduzchalar funksiyasi
        function setRating(starElement, ratingNumber) {
            const starsContainer = starElement.parentElement;
            const stars = starsContainer.querySelectorAll('i');
            
            stars.forEach((star, index) => {
                if (index < ratingNumber) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }
    </script>
