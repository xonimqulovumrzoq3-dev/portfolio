<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanimkulov.pro — Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000; /* Apple qora foni */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: #1c1c1e; /* Apple kalkulyator blok rangi */
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 30px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profil Qismi */
        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .avatar-box {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 2px;
            background: #ff9f0a; /* Apple olovrang aksent */
            box-shadow: 0 10px 25px rgba(255, 159, 10, 0.3);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .username {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .fullname {
            font-size: 14px;
            color: #aeaeb2;
            font-weight: 500;
        }

        /* Statistika Bloki */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #2c2c2e; /* Kalkulyator kulrang tugma rangi */
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stat-card:active {
            transform: scale(0.95);
        }

        .stat-num {
            font-size: 16px;
            font-weight: 700;
            color: #ff9f0a; /* Olovrang raqamlar */
            margin-bottom: 2px;
        }

        .stat-text {
            font-size: 11px;
            color: #aeaeb2;
        }

        /* Portfolio (9:16 Gorizontal Scroll Videolar) */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .horizontal-scroll-container {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 10px;
            margin-bottom: 25px;
            -webkit-overflow-scrolling: touch;
        }

        .horizontal-scroll-container::-webkit-scrollbar {
            display: none; /* Scrollbar'ni yashirish */
        }

        .video-card {
            flex: 0 0 150px; /* 9:16 format uchun eni */
            scroll-snap-align: start;
            background: #2c2c2e;
            border-radius: 24px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
        }

        /* 9:16 Reols/Video ramkasi */
        .video-frame {
            width: 100%;
            height: 266px; /* 9:16 proporsiya */
            border-radius: 16px;
            background: #000000;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .video-name {
            font-size: 12px;
            font-weight: 500;
            color: #aeaeb2;
        }

        /* Apple uslubidagi yulduzchalar */
        .rating-stars {
            display: flex;
            gap: 3px;
            cursor: pointer;
        }

        .rating-stars i {
            font-size: 12px;
            color: #48484a;
            transition: color 0.2s, transform 0.2s;
        }

        .rating-stars i.active {
            color: #ff9f0a; /* Olovrang yulduzcha */
            transform: scale(1.1);
        }

        /* Bog'lanish Tugmalari (Apple Style) */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .contact-btn {
            background: #2c2c2e;
            padding: 14px;
            border-radius: 20px;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .contact-btn:active {
            transform: scale(0.95);
        }

        .contact-btn.tg {
            background: #ff9f0a; /* Olovrang asosiy Apple tugma */
            color: #000000;
        }

        .contact-btn.tel {
            background: #3a3a3c;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profil Qismi -->
        <div class="profile-header">
            <div class="avatar-box">
                <img src="DE06565B-3157-4690-8C6A-AEF4FB8996D4.png" alt="Xanimkulov Umrzoq">
            </div>
            <div class="username">xanimkulov.pro</div>

        <!-- Statistika -->
        <div class="stats-grid">

        <!-- Portfolio (9:16 Gorizontal Scroll Videolar) -->
        <div class="section-title">
            <i class="fa-solid fa-clapperboard"></i> Portfolio (9:16)
        </div>

        <div class="horizontal-scroll-container">
            <!-- 1-Video -->
            <div class="video-card">
                <video class="video-frame" controls>
                    <source src="VIDEO_1.mp4" type="video/mp4">
                </video>
                <div class="video-info">
                    <span class="video-name">Loyiha #1</span>
                    <div class="rating-stars">
                        <i class="fa-solid fa-star" onclick="setRating(this, 1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 5)"></i>
                    </div>
                </div>
            </div>

            <!-- 2-Video -->
            <div class="video-card">
                <video class="video-frame" controls>
                    <source src="VIDEO_2.mp4" type="video/mp4">
                </video>
                <div class="video-info">
                    <span class="video-name">Loyiha #2</span>
                    <div class="rating-stars">
                        <i class="fa-solid fa-star" onclick="setRating(this, 1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 5)"></i>
                    </div>
                </div>
            </div>

            <!-- 3-Video -->
            <div class="video-card">
                <video class="video-frame" controls>
                    <source src="VIDEO_3.mp4" type="video/mp4">
                </video>
                <div class="video-info">
                    <span class="video-name">Loyiha #3</span>
                    <div class="rating-stars">
                        <i class="fa-solid fa-star" onclick="setRating(this, 1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 5)"></i>
                    </div>
                </div>
            </div>

            <!-- 4-Video -->
            <div class="video-card">
                <video class="video-frame" controls>
                    <source src="VIDEO_4.mp4" type="video/mp4">
                </video>
                <div class="video-info">
                    <span class="video-name">Loyiha #4</span>
                    <div class="rating-stars">
                        <i class="fa-solid fa-star" onclick="setRating(this, 1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 5)"></i>
                    </div>
                </div>
            </div>

            <!-- 5-Video -->
            <div class="video-card">
                <video class="video-frame" controls>
                    <source src="VIDEO_5.mp4" type="video/mp4">
                </video>
                <div class="video-info">
                    <span class="video-name">Loyiha #5</span>
                    <div class="rating-stars">
                        <i class="fa-solid fa-star" onclick="setRating(this, 1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 5)"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bog'lanish -->
        <div class="section-title">
            <i class="fa-solid fa-paper-plane"></i> Bog'lanish
        </div>

        <div class="contact-grid">
            <a href="https://t.me/xanimkulov" target="_blank" class="contact-btn tg">
                <i class="fa-brands fa-telegram fa-lg"></i> Telegram
            </a>
            <a href="tel:+998949990223" class="contact-btn tel">
                <i class="fa-solid fa-phone"></i> Qo'ng'iroq
            </a>
        </div>
    </div>

    <script>
        function setRating(starElement, ratingNumber) {
            const starsContainer = starElement.parentElement;
            const stars = starsContainer.querySelectorAll('i');
            
            stars.forEach((star, index) => {
                if (index < ratingNumber) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
