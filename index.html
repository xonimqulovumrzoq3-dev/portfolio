<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanimkulov.pro — Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0b0b0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Liquid Fon Effektlari */
        .bg-blob1 {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            filter: blur(90px);
            opacity: 0.5;
            z-index: -1;
        }

        .bg-blob2 {
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            filter: blur(90px);
            opacity: 0.5;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 36px;
            padding: 30px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        /* Profil Qismi */
        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .avatar-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #3b82f6, #ec4899);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .username {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .fullname {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 500;
        }

        /* Statistika Bloki */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 8px;
            border-radius: 20px;
            text-align: center;
        }

        .stat-num {
            font-size: 16px;
            font-weight: 700;
            color: #f43f5e;
            margin-bottom: 2px;
        }

        .stat-text {
            font-size: 11px;
            color: #9ca3af;
        }

        /* Portfolio (Videolar) Bo'limi */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .videos-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .videos-container::-webkit-scrollbar {
            width: 4px;
        }
        .videos-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-frame {
            width: 100%;
            height: 180px;
            border-radius: 14px;
            background: #181820;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-name {
            font-size: 13px;
            font-weight: 500;
            color: #d1d5db;
        }

        /* Yulduzchalar (Baholash) */
        .rating-stars {
            display: flex;
            gap: 4px;
            cursor: pointer;
        }

        .rating-stars i {
            font-size: 14px;
            color: #4b5563;
            transition: color 0.2s;
        }

        .rating-stars i.active {
            color: #f59e0b;
        }

        /* Bog'lanish Tugmalari */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .contact-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px;
            border-radius: 18px;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .contact-btn.tg {
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.2), rgba(0, 136, 204, 0.4));
            border-color: rgba(0, 136, 204, 0.4);
        }

        .contact-btn.tel {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.4));
            border-color: rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="bg-blob1"></div>
    <div class="bg-blob2"></div>

    <div class="container">
        <!-- Profil Qismi -->
        <div class="profile-header">
            <div class="avatar-box">
                <!-- Avatar rasmingiz -->
                <img src="image_4.png" alt="Xanimkulov Umrzoq">
            </div>
            <div class="username">xanimkulov.pro</div>
            <div class="fullname">Xanimkulov Umrzoq</div>
        </div>

        <!-- Statistika -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-num">2+ yil</div>
                <div class="stat-text">Tajriba</div>
            </div>
            <div class="stat-card">
                <div class="stat-num">100+</div>
                <div class="stat-text">Mijozlar</div>
            </div>
            <div class="stat-card">
                <div class="stat-num">20+</div>
                <div class="stat-text">Loyihalar</div>
            </div>
        </div>

        <!-- Portfolio (5 ta Video) -->
        <div class="section-title">
            <i class="fa-solid fa-video"></i> Mening Ishlarim (Portfolio)
        </div>

        <div class="videos-container">
            <!-- 1-Video -->
            <div class="video-card">
                <video class="video-frame" controls poster="">
                    <source src="VIDEO_HAVolasi_1.mp4" type="video/mp4">
                    Sizning brauzeringiz videoni qo'llab-quvvatlamaydi.
                </video>
                <div class="video-info">
                    <span class="video-name">Loyiha #1</span>
                    <div class="rating-stars" onclick="rateVideo(event)">
                        <i class="fa-solid fa-star" onclick="setRating(this, 1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 5)"></i>
                    </div>
                </div>
            </div>

            <!-- 2-Video -->
            <div class="video-card">
                <video class="video-frame" controls>
                    <source src="VIDEO_HAVolasi_2.mp4" type="video/mp4">
                </video>
                <div class="video-info">
                    <span class="video-name">Loyiha #2</span>
                    <div class="rating-stars" onclick="rateVideo(event)">
                        <i class="fa-solid fa-star" onclick="setRating(this, 1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 5)"></i>
                    </div>
                </div>
            </div>

            <!-- 3-Video -->
            <div class="video-card">
                <video class="video-frame" controls>
                    <source src="VIDEO_HAVolasi_3.mp4" type="video/mp4">
                </video>
                <div class="video-info">
                    <span class="video-name">Loyiha #3</span>
                    <div class="rating-stars" onclick="rateVideo(event)">
                        <i class="fa-solid fa-star" onclick="setRating(this, 1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 5)"></i>
                    </div>
                </div>
            </div>

            <!-- 4-Video -->
            <div class="video-card">
                <video class="video-frame" controls>
                    <source src="VIDEO_HAVolasi_4.mp4" type="video/mp4">
                </video>
                <div class="video-info">
                    <span class="video-name">Loyiha #4</span>
                    <div class="rating-stars" onclick="rateVideo(event)">
                        <i class="fa-solid fa-star" onclick="setRating(this, 1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 5)"></i>
                    </div>
                </div>
            </div>

            <!-- 5-Video -->
            <div class="video-card">
                <video class="video-frame" controls>
                    <source src="VIDEO_HAVolasi_5.mp4" type="video/mp4">
                </video>
                <div class="video-info">
                    <span class="video-name">Loyiha #5</span>
                    <div class="rating-stars" onclick="rateVideo(event)">
                        <i class="fa-solid fa-star" onclick="setRating(this, 1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(this, 5)"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bog'lanish -->
        <div class="section-title">
            <i class="fa-solid fa-paper-plane"></i> Bog'lanish
        </div>

        <div class="contact-grid">
            <a href="https://t.me/xanimkulov" target="_blank" class="contact-btn tg">
                <i class="fa-brands fa-telegram fa-lg"></i> Telegram
            </a>
            <a href="tel:+998949990223" class="contact-btn tel">
                <i class="fa-solid fa-phone"></i> Qo'ng'iroq
            </a>
        </div>
    </div>

    <script>
        // Yulduzchalarni bosib baholash funksiyasi
        function setRating(starElement, ratingNumber) {
            const starsContainer = starElement.parentElement;
            const stars = starsContainer.querySelectorAll('i');
            
            stars.forEach((star, index) => {
                if (index < ratingNumber) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
