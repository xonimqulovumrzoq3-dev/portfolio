<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanimkulov.pro — Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --container-bg: #1c1c1e;
            --text-color: #ffffff;
            --text-secondary: #aeaeb2;
            --accent-color: #ff9f0a;
            --card-bg: #2c2c2e;
            --border-color: rgba(255, 255, 255, 0.08);
            --btn-tel: #3a3a3c;
        }

        body.theme-2 {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-color: #1c1c1e;
            --text-secondary: #636366;
            --accent-color: #007aff;
            --card-bg: #f2f2f7;
            --border-color: rgba(0, 0, 0, 0.08);
            --btn-tel: #e5e5ea;
        }

        body.theme-3 {
            --bg-color: #08080a;
            --container-bg: #141418;
            --text-color: #ffffff;
            --text-secondary: #98989f;
            --accent-color: #ff3b30;
            --card-bg: #1f1f24;
            --border-color: rgba(255, 59, 48, 0.2);
            --btn-tel: #26262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 25px 18px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Musiqa Pleyeri */
        .music-player-box {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-info i {
            color: var(--accent-color);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .play-pause-btn {
            background: var(--accent-color);
            color: #ffffff;
            width: 36px;
            height: 36px;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
        }

        .volume-box i {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--border-color);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }

        /* Profil Qismi */
        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar-box {
            width: 100px;
            height: 100px;
            margin: 0 auto 12px;
            border-radius: 50%;
            padding: 2px;
            background: var(--accent-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .username {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .fullname {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Statistika Bloki */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px 6px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-num {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 2px;
        }

        .stat-text {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Portfolio (Ustma-ust Instagram Videolar) */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instagram-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 22px;
        }

        .insta-box {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* Instagram embed responsive dizayni uchun */
        .insta-box iframe {
            border-radius: 16px;
            max-width: 100%;
        }

        /* Bog'lanish Tugmalari */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .contact-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 20px;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .contact-btn:active {
            transform: scale(0.95);
        }

        .contact-btn.tg {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
        }

        .contact-btn.tel {
            background: var(--btn-tel);
        }
    </style>
</head>
<body class="theme-1">

    <div class="container">
        
        <!-- Musiqa Pleyeri -->
        <div class="music-player-box">
            <div class="player-top">
                <div class="track-info">
                    <i class="fa-solid fa-music"></i>
                    <span id="track-name">Chubina East Duo</span>
                </div>
                <div class="player-controls">
                    <button class="control-btn" onclick="prevTrack()" title="Oldingi"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="control-btn play-pause-btn" onclick="togglePlay()" id="play-icon-btn"><i class="fa-solid fa-play" id="play-pause-icon"></i></button>
                    <button class="control-btn" onclick="nextTrack()" title="Keyingi"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>
            <div class="volume-box">
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" min="0" max="1" step="0.05" value="0.5" class="volume-slider" oninput="changeVolume(this.value)">
                <i class="fa-solid fa-volume-high"></i>
            </div>
        </div>

        <audio id="audio-element" loop>
            <source src="ჩუბინა   East Duo.m4a" type="audio/mp4">
        </audio>

        <!-- Profil Qismi -->
        <div class="profile-header">
            <div class="avatar-box">
                <img src="DE06565B-3157-4690-8C6A-AEF4FB8996D4.png" alt="Xanimkulov Umrzoq">
            </div>
            <div class="username">xanimkulov.pro</div>
            <div class="fullname">Xanimkulov Umrzoq</div>
        </div>

        <!-- Statistika -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-num">2+ yil</div>
                <div class="stat-text">Tajriba</div>
            </div>
            <div class="stat-card">
                <div class="stat-num">100+</div>
                <div class="stat-text">Mijozlar</div>
            </div>
            <div class="stat-card">
                <div class="stat-num">20+</div>
                <div class="stat-text">Loyihalar</div>
            </div>
        </div>

        <!-- Portfolio (Ustma-ust turgan 2 ta Instagram Video) -->
        <div class="section-title">
            <i class="fa-solid fa-clapperboard"></i> Instagram Portfolio
        </div>

        <div class="instagram-stack">
            <!-- 1-Instagram Video -->
            <div class="insta-box">
                <blockquote class="//www.instagram.com/reel/DbHsSCao46I/?igsh=MWkxaGtzOW1hNG40eA==" data-instgrm-permalink="https://www.instagram.com/reel/DbHsSCao46I/?igsh=MWkxaGtzOW1hNG40eA==" data-instgrm-version="14" style=" background:#FFF; border:0; border-radius:16px; margin:0; max-width:540px; min-width:326px; padding:0; width:99.375%; width:-webkit-calc(100% - 2px); width:calc(100% - 2px);"></blockquote>
            </div>

            <!-- 2-Instagram Video -->
            <div class="insta-box">
                <blockquote class="https://www.instagram.com/reel/DbHsSCao46I/?igsh=MWkxaGtzOW1hNG40eA==" data-instgrm-permalink="https://www.instagram.com/reel/DbHsSCao46I/?igsh=MWkxaGtzOW1hNG40eA==" data-instgrm-version="14" style=" background:#FFF; border:0; border-radius:16px; margin:0; max-width:540px; min-width:326px; padding:0; width:99.375%; width:-webkit-calc(100% - 2px); width:calc(100% - 2px);"></blockquote>
            </div>
        </div>

        <!-- Instagram Skripti (Videolar chiroyli chiqishi uchun muhim) -->
        <script async src="//www.instagram.com/embed.js"></script>

        <!-- Bog'lanish -->
        <div class="section-title">
            <i class="fa-solid fa-paper-plane"></i> Bog'lanish
        </div>

        <div class="contact-grid">
            <a href="https://t.me/xanimkulov" target="_blank" class="contact-btn tg">
                <i class="fa-brands fa-telegram fa-lg"></i> Telegram
            </a>
            <a href="tel:+998949990223" class="contact-btn tel">
                <i class="fa-solid fa-phone"></i> Qo'ng'iroq
            </a>
        </div>
    </div>

    <script>
        const playlist = [
            { src: "Chubina East Duo.m4a", name: "Chubina East Duo", theme: "theme-1" },
            { src: "17) Emotional - Think Music.mp3", name: "Emotional - Think Music (1)", theme: "theme-2" },
            { src: "18) Emotional - Think Music.mp3", name: "Emotional - Think Music (2)", theme: "theme-3" }
        ];

        let currentIndex = 0;
        const audio = document.getElementById('audio-element');
        const trackNameEl = document.getElementById('track-name');
        const playPauseIcon = document.getElementById('play-pause-icon');

        audio.volume = 0.5;

        function loadTrack(index) {
            audio.src = playlist[index].src;
            trackNameEl.innerText = playlist[index].name;
            document.body.className = playlist[index].theme;
            audio.load();
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playPauseIcon.className = "fa-solid fa-pause";
            } else {
                audio.pause();
                playPauseIcon.className = "fa-solid fa-play";
            }
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            audio.play();
            playPauseIcon.className = "fa-solid fa-pause";
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            audio.play();
            playPauseIcon.className = "fa-solid fa-pause";
        }

        function changeVolume(val) {
            audio.volume = val;
        }
    </script>
</body>
</html>
